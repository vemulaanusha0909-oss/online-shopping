<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛍️ ShopEasy</h1>
    <p>Your Online Shopping Store</p>

    <input 
        type="text" 
        id="search" 
        placeholder="Search products..."
        onkeyup="searchProducts()"
    >

    <button onclick="showCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<nav>
    <button onclick="filterProducts('all')">All</button>
    <button onclick="filterProducts('fashion')">Fashion</button>
    <button onclick="filterProducts('electronics')">Electronics</button>
    <button onclick="filterProducts('home')">Home</button>
</nav>

<main>
    <h2>Popular Products</h2>

    <div class="products" id="productList"></div>
</main>

<div class="cart" id="cart">
    <div class="cart-box">
        <button class="close" onclick="closeCart()">✖</button>

        <h2>🛒 Your Cart</h2>

        <div id="cartItems"></div>

        <h3>Total: ₹<span id="total">0</span></h3>

        <button class="checkout" onclick="checkout()">
            Proceed to Checkout
        </button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
